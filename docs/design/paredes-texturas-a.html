<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Texturas: lote a</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; background: #16130f; color: #e8dcc4; font: 14px "Segoe UI", sans-serif; }
  header { padding: 12px 16px; display: flex; gap: 16px; align-items: center; flex-wrap: wrap; }
  header b { color: #c9a36a; }
  button { background: #2a241c; color: #e8dcc4; border: 1px solid #5a4a33; border-radius: 4px; padding: 4px 10px; cursor: pointer; font: inherit; }
  button.on { background: #8a6a3a; border-color: #c9a36a; color: #fff; }
  h2 { margin: 18px 16px 6px; font-size: 16px; color: #c9a36a; }
  .row { display: flex; gap: 12px; padding: 0 16px; flex-wrap: wrap; }
  figure { margin: 0; }
  figcaption { padding: 4px 0 0; color: #b8a888; font-size: 13px; }
  canvas { display: block; border: 1px solid #3a3025; }
</style>
</head>
<body>
<header>
  <span><b>Lote a:</b> rocha, pedra lavrada, tijolo e madeira. Cada quadro tem a mesma cena (quina, T, diagonal e ponta solta).</span>
  <span><b>Zoom</b> <button data-z="1" class="on">Normal</button><button data-z="2">Perto</button></span>
  <span><b>Espessura</b> <button data-t="0.18">Fina (padrão)</button><button data-t="0.35" class="on">Média</button><button data-t="0.6">Grossa</button></span>
</header>
<div id="sections"></div>
<script>
const COLS = 9, ROWS = 6.4;
let CELL = 44;
let T = 0.35;
const SCENE = [
  { a: [1, 1], b: [8, 1] }, { a: [8, 1], b: [8, 5.5] }, { a: [1, 1], b: [1, 4] },
  { a: [4.5, 1], b: [4.5, 3.4] }, // T
  { a: [1, 4], b: [3.5, 5.6] },   // diagonal com ponta solta
];

// ---------- utilidades ----------
const sub = (p, q) => [p[0] - q[0], p[1] - q[1]], add = (p, q) => [p[0] + q[0], p[1] + q[1]], mul = (p, k) => [p[0] * k, p[1] * k];
const cross = (p, q) => p[0] * q[1] - p[1] * q[0], dot = (p, q) => p[0] * q[0] + p[1] * q[1], len = (p) => Math.hypot(p[0], p[1]);
const norm = (p) => { const l = len(p) || 1; return [p[0] / l, p[1] / l]; };
const key = (p) => `${p[0].toFixed(3)},${p[1].toFixed(3)}`;
function hash(...values) { let h = 2166136261; for (const v of values) { h ^= Math.round(v * 1000) | 0; h = Math.imul(h, 16777619); } h ^= h >>> 13; h = Math.imul(h, 0x5bd1e995); h ^= h >>> 15; return (h >>> 0) / 4294967296; }
function shade(hex, k) { const n = parseInt(hex.slice(1), 16); const c = [(n >> 16) & 255, (n >> 8) & 255, n & 255].map((v) => Math.round(k > 0 ? v + (255 - v) * k : v * (1 + k))); return `rgb(${c[0]},${c[1]},${c[2]})`; }
function noise1(x, seed) { const i = Math.floor(x), f = x - i, u = f * f * (3 - 2 * f); return hash(i, seed) * (1 - u) + hash(i + 1, seed) * u; }
const grainCanvas = (() => { const c = document.createElement("canvas"); c.width = c.height = 128; const g = c.getContext("2d"); const img = g.createImageData(128, 128); for (let i = 0; i < img.data.length; i += 4) { const v = 150 + Math.random() * 105; img.data[i] = img.data[i + 1] = img.data[i + 2] = v; img.data[i + 3] = 255; } g.putImageData(img, 0, 0); return c; })();
function grain(ctx, x, y, w, h, alpha, s = 0.35) { const p = ctx.createPattern(grainCanvas, "repeat"); p.setTransform(new DOMMatrix().scale(s)); ctx.save(); ctx.globalCompositeOperation = "multiply"; ctx.globalAlpha = alpha; ctx.fillStyle = p; ctx.fillRect(x, y, w, h); ctx.restore(); }
const INK = "#1d1712";
// Luz vem de cima à esquerda (no mundo): o lado da parede virado para ela fica mais claro.
const LIGHT = norm([-0.6, -0.8]);

// ---------- emenda (a mesma do teste aprovado) ----------
function splitWalls(walls) {
  const edges = new Map();
  walls.forEach((wall, i) => {
    const p = wall.a, r = sub(wall.b, wall.a), ts = [0, 1];
    walls.forEach((other, j) => {
      if (i === j) return;
      const q = other.a, s = sub(other.b, other.a), d = cross(r, s);
      if (Math.abs(d) < 1e-9) { if (Math.abs(cross(sub(q, p), r)) > 1e-6) return; for (const e of [other.a, other.b]) { const t = dot(sub(e, p), r) / dot(r, r); if (t > 1e-6 && t < 1 - 1e-6) ts.push(t); } return; }
      const t = cross(sub(q, p), s) / d, u = cross(sub(q, p), r) / d;
      if (t > -1e-6 && t < 1 + 1e-6 && u > -1e-6 && u < 1 + 1e-6) ts.push(Math.min(1, Math.max(0, t)));
    });
    ts.sort((x, y) => x - y);
    for (let k = 0; k < ts.length - 1; k++) { if (ts[k + 1] - ts[k] < 1e-6) continue; const a = add(p, mul(r, ts[k])), b = add(p, mul(r, ts[k + 1])); edges.set([key(a), key(b)].sort().join("|"), { a, b }); }
  });
  return [...edges.values()].map((e, index) => ({ ...e, index }));
}
function chainsOf(walls) {
  const edges = splitWalls(walls), nodes = new Map();
  const node = (p) => { const k = key(p); if (!nodes.has(k)) nodes.set(k, { p, edges: [] }); return nodes.get(k); };
  for (const e of edges) { node(e.a).edges.push(e); node(e.b).edges.push(e); }
  const other = (e, k) => (key(e.a) === k ? e.b : e.a);
  const paired = new Map();
  for (const [k, n] of nodes) {
    if (n.edges.length === 2) { paired.set(`${k}|${n.edges[0].index}`, n.edges[1]); paired.set(`${k}|${n.edges[1].index}`, n.edges[0]); continue; }
    const ang = (e) => { const d = sub(other(e, k), n.p); return Math.atan2(d[1], d[0]); };
    const cand = []; for (let i = 0; i < n.edges.length; i++) for (let j = i + 1; j < n.edges.length; j++) { let df = Math.abs(ang(n.edges[i]) - ang(n.edges[j])); if (df > Math.PI) df = 2 * Math.PI - df; if (Math.PI - df < 0.35) cand.push([Math.PI - df, n.edges[i], n.edges[j]]); }
    cand.sort((x, y) => x[0] - y[0]); const used = new Set();
    for (const [, a, b] of cand) { if (used.has(a) || used.has(b)) continue; used.add(a); used.add(b); paired.set(`${k}|${a.index}`, b); paired.set(`${k}|${b.index}`, a); }
  }
  const seen = new Set(), out = [];
  const walk = (edge, from) => { const pts = [from]; let cur = edge, at = from; for (;;) { seen.add(cur); const next = other(cur, key(at)); pts.push(next); const f = paired.get(`${key(next)}|${cur.index}`); if (!f || seen.has(f)) { const closed = f === edge && key(next) === key(pts[0]); const shape = closed ? pts.slice(0, -1) : pts; const end = (p) => (nodes.get(key(p)).edges.length > 1 ? "butt" : "free"); return { pts: shape, closed, ends: closed ? ["closed", "closed"] : [end(shape[0]), end(shape[shape.length - 1])] }; } cur = f; at = next; } };
  for (const e of edges) for (const end of [e.a, e.b]) if (!seen.has(e) && !paired.get(`${key(end)}|${e.index}`)) out.push(walk(e, end));
  for (const e of edges) if (!seen.has(e)) out.push(walk(e, e.a));
  return out.sort((x, y) => x.pts.length - y.pts.length);
}
function outline(chain, half, t) {
  const { pts, closed } = chain, n = pts.length, dirs = [];
  for (let i = 0; i < (closed ? n : n - 1); i++) dirs.push(norm(sub(pts[(i + 1) % n], pts[i])));
  const normal = (d) => [-d[1], d[0]], left = [], right = [];
  for (let k = 0; k < n; k++) {
    const prev = closed ? dirs[(k - 1 + n) % n] : dirs[k - 1], next = closed ? dirs[k % n] : dirs[k];
    let off; if (prev && next) { const b = norm(add(normal(prev), normal(next))); off = mul(b, half / Math.max(0.3, dot(b, normal(next)))); } else off = mul(normal(prev || next), half);
    let p = pts[k]; if (!closed && k === 0 && chain.ends[0] === "free") p = sub(p, mul(next, t * 0.12)); if (!closed && k === n - 1 && chain.ends[1] === "free") p = add(p, mul(prev, t * 0.12));
    left.push(add(p, off)); right.push(sub(p, off));
  }
  return { left, right, dirs };
}
function outlinePath(chain, half, t) { const { left, right } = outline(chain, half, t); const path = new Path2D(); left.forEach((p, i) => (i ? path.lineTo(...p) : path.moveTo(...p))); right.slice().reverse().forEach((p) => path.lineTo(...p)); path.closePath(); return path; }
/** Pontos ao longo da cadeia a cada `step` px, com a normal (média nas quinas) e o comprimento acumulado. */
function samples(chain, step) {
  const { pts } = chain, out = []; let s = 0;
  for (let i = 0; i < pts.length - 1; i++) {
    const a = pts[i], b = pts[i + 1], L = len(sub(b, a)), d = norm(sub(b, a)), nrm = [-d[1], d[0]];
    for (let x = 0; x < L; x += step) out.push({ p: add(a, mul(d, x)), n: nrm, d, s: s + x });
    s += L;
  }
  const last = pts[pts.length - 1], d = norm(sub(last, pts[pts.length - 2])); out.push({ p: last, n: [-d[1], d[0]], d, s });
  return out;
}

// ---------- pintores por fiada (no eixo do trecho; x = comprimento da cadeia) ----------
function courses(seed, row, phase, from, to, widthOf) { const out = []; let s = -6 - phase, j = 0; while (s < to) { const w = widthOf(hash(seed, row, j)); if (s + w > from) out.push({ s, w, j }); s += w; j++; } return out; }
const STONE = ["#a39a8a", "#948b7b", "#ada493", "#8a8273", "#9c9281", "#b5ab98"];
const WOOD = ["#8b5a2b", "#7d5026", "#966534", "#714720"];
const BRICK = ["#9a4a32", "#8a412c", "#a5553a", "#7e3a27", "#93503a"];

const PAINT = {
  stoneA(ctx, x0, x1, t, seed) { // fiadas de blocos (o do teste aprovado)
    const h = t / 2, gap = t * 0.06; ctx.fillStyle = "#4a443c"; ctx.fillRect(x0, -t / 2, x1 - x0, t);
    for (let row = 0; row < 2; row++) for (const b of courses(seed, row, row * h * 0.6, x0, x1, (r) => h * (1.1 + r * 1.3))) {
      const y0 = -t / 2 + row * h, tone = STONE[Math.floor(hash(seed, row, b.j, 7) * STONE.length)];
      const block = new Path2D(); block.roundRect(b.s + gap / 2, y0 + gap / 2, b.w - gap, h - gap, h * 0.22);
      const g = ctx.createLinearGradient(0, y0, 0, y0 + h); g.addColorStop(0, shade(tone, 0.15)); g.addColorStop(1, shade(tone, -0.22)); ctx.fillStyle = g; ctx.fill(block);
      ctx.save(); ctx.clip(block); grain(ctx, b.s, y0, b.w, h, 0.4); if (hash(seed, row, b.j, 9) < 0.18) { ctx.fillStyle = "rgba(92,120,60,.55)"; ctx.beginPath(); ctx.ellipse(b.s + b.w * hash(seed, b.j, 3), y0 + h * 0.7, b.w * 0.25, h * 0.25, 0, 0, 7); ctx.fill(); } ctx.restore();
      ctx.strokeStyle = "rgba(255,246,225,.45)"; ctx.lineWidth = t * 0.035; ctx.beginPath(); ctx.moveTo(b.s + gap * 1.5, y0 + gap * 1.1); ctx.lineTo(b.s + b.w - gap * 1.5, y0 + gap * 1.1); ctx.stroke();
      ctx.strokeStyle = "rgba(20,15,10,.5)"; ctx.lineWidth = t * 0.025; ctx.stroke(block);
    }
  },
  stoneB(ctx, x0, x1, t, seed) { // silhares grandes, uma fiada só, com chanfro
    ctx.fillStyle = "#3e3933"; ctx.fillRect(x0, -t / 2, x1 - x0, t);
    for (const b of courses(seed, 0, 0, x0, x1, (r) => t * (1.3 + r * 1.4))) {
      const tone = STONE[Math.floor(hash(seed, b.j, 4) * STONE.length)], g = t * 0.05;
      const outer = new Path2D(); outer.rect(b.s + g, -t / 2 + g, b.w - 2 * g, t - 2 * g);
      ctx.fillStyle = shade(tone, -0.18); ctx.fill(outer);
      const bev = t * 0.16; const inner = new Path2D(); inner.rect(b.s + g + bev, -t / 2 + g + bev, b.w - 2 * (g + bev), t - 2 * (g + bev));
      ctx.fillStyle = shade(tone, 0.12); ctx.fill(inner);
      ctx.fillStyle = "rgba(255,248,230,.35)"; ctx.beginPath(); ctx.moveTo(b.s + g, -t / 2 + g); ctx.lineTo(b.s + b.w - g, -t / 2 + g); ctx.lineTo(b.s + b.w - g - bev, -t / 2 + g + bev); ctx.lineTo(b.s + g + bev, -t / 2 + g + bev); ctx.fill();
      ctx.fillStyle = "rgba(0,0,0,.22)"; ctx.beginPath(); ctx.moveTo(b.s + g, t / 2 - g); ctx.lineTo(b.s + b.w - g, t / 2 - g); ctx.lineTo(b.s + b.w - g - bev, t / 2 - g - bev); ctx.lineTo(b.s + g + bev, t / 2 - g - bev); ctx.fill();
      ctx.save(); ctx.clip(outer); grain(ctx, b.s, -t / 2, b.w, t, 0.45);
      if (hash(seed, b.j, 8) < 0.35) { ctx.strokeStyle = "rgba(30,24,18,.55)"; ctx.lineWidth = t * 0.025; ctx.beginPath(); let x = b.s + b.w * (0.2 + hash(seed, b.j, 2) * 0.6), y = -t / 2; ctx.moveTo(x, y); for (let k = 0; k < 4; k++) { x += (hash(seed, b.j, k) - 0.5) * t * 0.3; y += t * 0.25; ctx.lineTo(x, y); } ctx.stroke(); }
      ctx.restore(); ctx.strokeStyle = "rgba(20,15,10,.6)"; ctx.lineWidth = t * 0.03; ctx.stroke(outer);
    }
  },
  stoneC(ctx, x0, x1, t, seed) { // três fiadas de pedras gastas, juntas grossas e claras
    ctx.fillStyle = "#b9ae98"; ctx.fillRect(x0, -t / 2, x1 - x0, t);
    const rows = 3, h = t / rows;
    for (let row = 0; row < rows; row++) for (const b of courses(seed, row, row * h * 0.7, x0, x1, (r) => h * (1.2 + r * 1.6))) {
      const y0 = -t / 2 + row * h, tone = STONE[Math.floor(hash(seed, row, b.j, 6) * STONE.length)], gap = t * 0.05;
      const stone = new Path2D(); stone.roundRect(b.s + gap / 2, y0 + gap / 2, b.w - gap, h - gap, h * 0.45);
      const g = ctx.createRadialGradient(b.s + b.w * 0.35, y0 + h * 0.3, 0, b.s + b.w * 0.5, y0 + h * 0.5, b.w * 0.7); g.addColorStop(0, shade(tone, 0.2)); g.addColorStop(1, shade(tone, -0.28));
      ctx.fillStyle = g; ctx.fill(stone); ctx.save(); ctx.clip(stone); grain(ctx, b.s, y0, b.w, h, 0.5); ctx.restore();
      ctx.strokeStyle = "rgba(40,32,24,.55)"; ctx.lineWidth = t * 0.025; ctx.stroke(stone);
    }
  },
  brickA(ctx, x0, x1, t, seed) { // tijolo à vista, junta clara (o do teste)
    const rows = 4, h = t / rows, bl = t * 0.5; ctx.fillStyle = "#c9bfae"; ctx.fillRect(x0, -t / 2, x1 - x0, t);
    for (let row = 0; row < rows; row++) for (const b of courses(seed, row, (row % 2) * bl / 2, x0, x1, () => bl)) { const y0 = -t / 2 + row * h; ctx.fillStyle = BRICK[Math.floor(hash(seed, row, b.j, 3) * BRICK.length)]; ctx.fillRect(b.s + t * 0.02, y0 + t * 0.02, bl - t * 0.04, h - t * 0.04); ctx.fillStyle = "rgba(255,230,200,.22)"; ctx.fillRect(b.s + t * 0.02, y0 + t * 0.02, bl - t * 0.04, h * 0.18); }
    grain(ctx, x0, -t / 2, x1 - x0, t, 0.35);
  },
  brickB(ctx, x0, x1, t, seed) { // reboco por cima, tijolo aparecendo onde caiu
    PAINT.brickA(ctx, x0, x1, t, seed);
    ctx.save(); const plaster = new Path2D();
    for (let x = Math.floor(x0 / (t * 0.4)) * t * 0.4; x < x1; x += t * 0.4) { const n = noise1(x / t * 0.7, seed); if (n > 0.38) plaster.rect(x - 1, -t / 2, t * 0.4 + 2, t); }
    ctx.clip(plaster); ctx.fillStyle = "#d8cdb5"; ctx.fillRect(x0, -t / 2, x1 - x0, t); grain(ctx, x0, -t / 2, x1 - x0, t, 0.55, 0.5);
    ctx.fillStyle = "rgba(255,250,235,.4)"; ctx.fillRect(x0, -t / 2, x1 - x0, t * 0.12); ctx.restore();
  },
  brickC(ctx, x0, x1, t, seed) { // tijolo escuro, junta escura, alguns queimados
    const rows = 3, h = t / rows, bl = t * 0.62; ctx.fillStyle = "#3a2a22"; ctx.fillRect(x0, -t / 2, x1 - x0, t);
    for (let row = 0; row < rows; row++) for (const b of courses(seed, row, (row % 2) * bl / 2, x0, x1, () => bl)) {
      const y0 = -t / 2 + row * h, r = hash(seed, row, b.j, 5), tone = r < 0.15 ? "#4a2a20" : BRICK[Math.floor(r * BRICK.length)];
      const brick = new Path2D(); brick.roundRect(b.s + t * 0.03, y0 + t * 0.03, bl - t * 0.06, h - t * 0.06, t * 0.03);
      const g = ctx.createLinearGradient(0, y0, 0, y0 + h); g.addColorStop(0, shade(tone, 0.12)); g.addColorStop(1, shade(tone, -0.2)); ctx.fillStyle = g; ctx.fill(brick);
      ctx.save(); ctx.clip(brick); grain(ctx, b.s, y0, bl, h, 0.45); ctx.restore();
    }
  },
  woodA(ctx, x0, x1, t, seed) { // tábuas ao comprido com pregos (o do teste)
    const rows = 3, h = t / rows; ctx.fillStyle = "#3a2614"; ctx.fillRect(x0, -t / 2, x1 - x0, t);
    for (let row = 0; row < rows; row++) for (const b of courses(seed, row, row * t * 0.9, x0, x1, (r) => t * (2.2 + r * 2.5))) {
      const y0 = -t / 2 + row * h, tone = WOOD[Math.floor(hash(seed, row, b.j, 5) * WOOD.length)];
      const plank = new Path2D(); plank.rect(b.s + t * 0.02, y0 + t * 0.015, b.w - t * 0.04, h - t * 0.03);
      const g = ctx.createLinearGradient(0, y0, 0, y0 + h); g.addColorStop(0, shade(tone, 0.12)); g.addColorStop(1, shade(tone, -0.2)); ctx.fillStyle = g; ctx.fill(plank);
      ctx.save(); ctx.clip(plank); ctx.strokeStyle = "rgba(40,22,8,.35)"; ctx.lineWidth = t * 0.012;
      for (let k = 0; k < 3; k++) { const yy = y0 + h * (0.25 + k * 0.25); ctx.beginPath(); for (let x = b.s; x <= b.s + b.w; x += t * 0.2) ctx.lineTo(x, yy + Math.sin(x / t * 3 + hash(seed, b.j, k) * 9) * h * 0.08); ctx.stroke(); }
      grain(ctx, b.s, y0, b.w, h, 0.3); ctx.restore();
      ctx.fillStyle = "#2a2a2e"; for (const x of [b.s + t * 0.12, b.s + b.w - t * 0.12]) { ctx.beginPath(); ctx.arc(x, y0 + h / 2, t * 0.025, 0, 7); ctx.fill(); }
    }
  },
  woodB(ctx, x0, x1, t, seed) { // tronco deitado (casa de toras)
    for (const b of courses(seed, 0, 0, x0, x1, (r) => t * (4 + r * 3))) {
      const log = new Path2D(); log.roundRect(b.s + t * 0.03, -t * 0.48, b.w - t * 0.06, t * 0.96, t * 0.3);
      const g = ctx.createLinearGradient(0, -t / 2, 0, t / 2); g.addColorStop(0, "#a4774a"); g.addColorStop(0.35, "#8a5a30"); g.addColorStop(1, "#4a2c14");
      ctx.fillStyle = g; ctx.fill(log); ctx.save(); ctx.clip(log);
      ctx.strokeStyle = "rgba(35,18,6,.5)"; ctx.lineWidth = t * 0.03;
      for (let k = 0; k < 6; k++) { const yy = -t * 0.38 + k * t * 0.15; ctx.beginPath(); for (let x = b.s; x <= b.s + b.w; x += t * 0.25) ctx.lineTo(x, yy + (noise1(x / t * 2, seed + k + b.j) - 0.5) * t * 0.1); ctx.stroke(); }
      for (let k = 0; k < 2; k++) { const kx = b.s + b.w * (0.25 + hash(seed, b.j, k) * 0.5); ctx.fillStyle = "#3a2210"; ctx.beginPath(); ctx.ellipse(kx, (hash(seed, b.j, k + 5) - 0.5) * t * 0.4, t * 0.08, t * 0.06, 0, 0, 7); ctx.fill(); }
      grain(ctx, b.s, -t / 2, b.w, t, 0.3); ctx.restore();
      ctx.strokeStyle = "#1d1208"; ctx.lineWidth = t * 0.04; ctx.stroke(log);
    }
  },
  woodC(ctx, x0, x1, t, seed) { // enxaimel: vigas nas bordas, reboco no meio, esteio a cada casa
    ctx.fillStyle = "#d9cdb2"; ctx.fillRect(x0, -t / 2, x1 - x0, t); grain(ctx, x0, -t / 2, x1 - x0, t, 0.5, 0.5);
    const beam = (y, h) => { const g = ctx.createLinearGradient(0, y, 0, y + h); g.addColorStop(0, "#6e4520"); g.addColorStop(1, "#3a2210"); ctx.fillStyle = g; ctx.fillRect(x0, y, x1 - x0, h); };
    beam(-t / 2, t * 0.24); beam(t / 2 - t * 0.24, t * 0.24);
    for (let x = Math.floor(x0 / CELL) * CELL; x < x1; x += CELL) { ctx.fillStyle = "#4a2c14"; ctx.fillRect(x - t * 0.14, -t / 2, t * 0.28, t); ctx.fillStyle = "rgba(255,230,190,.25)"; ctx.fillRect(x - t * 0.14, -t / 2, t * 0.06, t); }
  },
};

// ---------- rocha: desenhada pelo caminho, no mundo ----------
const ROCK = ["#8f877a", "#7f786c", "#9a9283", "#857d70", "#a39b8b"];
/** Pedras ao longo do caminho; `pick(i, sample)` diz o tamanho/forma. Devolve caminhos para tinta e corpo. */
function rocksAlong(chain, t, seed, spacing, size, sides, flat) {
  const out = [];
  for (const smp of samples(chain, t * spacing)) {
    const k = hash(seed, Math.round(smp.s)), side = (hash(seed, Math.round(smp.s), 2) - 0.5) * t * 0.35;
    const c = add(smp.p, mul(smp.n, side)), r = t * size * (0.75 + k * 0.5), poly = [];
    const ang0 = Math.atan2(smp.d[1], smp.d[0]);
    for (let v = 0; v < sides; v++) { const a = ang0 + (v / sides) * Math.PI * 2 + k; const stretch = flat ? (Math.abs(Math.cos(a - ang0)) * 0.6 + 0.6) : 1; const rr = r * stretch * (0.7 + hash(seed, v, Math.round(smp.s)) * 0.45); poly.push(add(c, [Math.cos(a) * rr, Math.sin(a) * rr])); }
    const path = new Path2D(); poly.forEach((p, i) => (i ? path.lineTo(...p) : path.moveTo(...p))); path.closePath();
    out.push({ path, poly, c, r, tone: ROCK[Math.floor(k * ROCK.length)], k });
  }
  // as maiores por baixo
  return out.sort((a, b) => b.r - a.r);
}
function drawRocks(ctx, rocks, t, facets) {
  ctx.save(); ctx.shadowColor = "rgba(0,0,0,.5)"; ctx.shadowBlur = t * 0.5; ctx.shadowOffsetY = t * 0.2; ctx.fillStyle = INK; for (const r of rocks) ctx.fill(r.path); ctx.restore();
  ctx.lineJoin = "round"; ctx.strokeStyle = INK; ctx.lineWidth = t * 0.2; for (const r of rocks) ctx.stroke(r.path);
  for (const r of rocks) {
    const lit = add(r.c, mul(LIGHT, r.r * 0.5));
    const g = ctx.createRadialGradient(lit[0], lit[1], 0, r.c[0], r.c[1], r.r * 1.3); g.addColorStop(0, shade(r.tone, 0.25)); g.addColorStop(0.6, r.tone); g.addColorStop(1, shade(r.tone, -0.35));
    ctx.fillStyle = g; ctx.fill(r.path);
    ctx.save(); ctx.clip(r.path); grain(ctx, r.c[0] - r.r * 1.5, r.c[1] - r.r * 1.5, r.r * 3, r.r * 3, 0.45);
    if (facets) { ctx.strokeStyle = "rgba(30,24,18,.45)"; ctx.lineWidth = t * 0.03; ctx.beginPath(); ctx.moveTo(...r.poly[0]); ctx.lineTo(...add(r.c, mul([r.k - 0.5, 0.3], r.r * 0.6))); ctx.lineTo(...r.poly[Math.floor(r.poly.length / 2)]); ctx.stroke(); ctx.strokeStyle = "rgba(255,248,230,.35)"; ctx.lineWidth = t * 0.025; ctx.beginPath(); ctx.moveTo(...r.poly[1]); ctx.lineTo(...r.poly[2]); ctx.stroke(); }
    ctx.restore(); ctx.strokeStyle = "rgba(25,18,12,.55)"; ctx.lineWidth = t * 0.03; ctx.stroke(r.path);
  }
}
/** Rocha B: paredão contínuo com largura que varia, faces e rachaduras. */
function cliffBand(chain, t, seed) {
  const sm = samples(chain, t * 0.25), left = [], right = [];
  for (const s of sm) { const wl = t * (0.45 + noise1(s.s / t * 0.9, seed) * 0.45), wr = t * (0.45 + noise1(s.s / t * 0.9, seed + 7) * 0.45); left.push(add(s.p, mul(s.n, wl))); right.push(sub(s.p, mul(s.n, wr))); }
  if (chain.ends[0] === "free") { const s = sm[0]; left.unshift(add(sub(s.p, mul(s.d, t * 0.5)), mul(s.n, t * 0.2))); right.unshift(sub(sub(s.p, mul(s.d, t * 0.5)), mul(s.n, t * 0.2))); }
  if (chain.ends[1] === "free") { const s = sm[sm.length - 1]; left.push(add(add(s.p, mul(s.d, t * 0.5)), mul(s.n, t * 0.2))); right.push(sub(add(s.p, mul(s.d, t * 0.5)), mul(s.n, t * 0.2))); }
  const path = new Path2D(); left.forEach((p, i) => (i ? path.lineTo(...p) : path.moveTo(...p))); right.slice().reverse().forEach((p) => path.lineTo(...p)); path.closePath();
  return { path, sm, left, right };
}

const VERSIONS = {
  rock: [
    { name: "A. Blocos grandes e irregulares", draw(ctx, chains, t, seed) { const all = chains.flatMap((c, i) => rocksAlong(c, t, seed + i, 0.75, 0.75, 7, false)); drawRocks(ctx, all, t, true); } },
    { name: "B. Paredão de caverna (largura que varia, faces e rachaduras)", draw(ctx, chains, t, seed) {
      const bands = chains.map((c, i) => cliffBand(c, t, seed + i));
      ctx.save(); ctx.shadowColor = "rgba(0,0,0,.5)"; ctx.shadowBlur = t * 0.6; ctx.shadowOffsetY = t * 0.2; ctx.fillStyle = INK; for (const b of bands) ctx.fill(b.path); ctx.restore();
      ctx.lineJoin = "round"; ctx.strokeStyle = INK; ctx.lineWidth = t * 0.22; for (const b of bands) ctx.stroke(b.path);
      for (const b of bands) {
        ctx.fillStyle = "#8a8275"; ctx.fill(b.path); ctx.save(); ctx.clip(b.path);
        // faces: manchas claras do lado da luz, escuras do outro
        for (const s of b.sm) { const k = hash(seed, Math.round(s.s)); if (k < 0.5) continue; const lightSide = dot(s.n, LIGHT) < 0 ? 1 : -1; const c = add(s.p, mul(s.n, -lightSide * t * 0.2)); ctx.fillStyle = `rgba(230,222,205,${0.18 + k * 0.15})`; ctx.beginPath(); ctx.ellipse(c[0], c[1], t * 0.45, t * 0.18, Math.atan2(s.d[1], s.d[0]) + (k - 0.75), 0, 7); ctx.fill(); }
        grain(ctx, 0, 0, W, H, 0.5);
        ctx.strokeStyle = "rgba(30,24,18,.55)"; ctx.lineWidth = t * 0.035;
        for (let i = 0; i < b.sm.length; i += 3) { const s = b.sm[i]; if (hash(seed, i, 4) < 0.45) continue; let p = add(s.p, mul(s.n, (hash(seed, i, 5) - 0.5) * t * 0.6)); ctx.beginPath(); ctx.moveTo(...p); for (let k = 0; k < 3; k++) { p = add(p, add(mul(s.d, t * 0.22), mul(s.n, (hash(seed, i, k) - 0.5) * t * 0.25))); ctx.lineTo(...p); } ctx.stroke(); }
        ctx.restore();
        ctx.strokeStyle = "rgba(255,248,230,.3)"; ctx.lineWidth = t * 0.04; ctx.beginPath(); b.left.forEach((p, i) => (i ? ctx.lineTo(...p) : ctx.moveTo(...p))); ctx.stroke();
      }
    } },
    { name: "C. Lajes empilhadas com cascalho", draw(ctx, chains, t, seed) { const big = chains.flatMap((c, i) => rocksAlong(c, t, seed + i, 0.95, 0.72, 6, true)); const small = chains.flatMap((c, i) => rocksAlong(c, t, seed + 50 + i, 0.45, 0.28, 5, false)); drawRocks(ctx, small, t, false); drawRocks(ctx, big, t, true); } },
  ],
  stone: [{ name: "A. Duas fiadas de blocos (o do teste)", paint: "stoneA" }, { name: "B. Silhares grandes com chanfro e rachaduras", paint: "stoneB" }, { name: "C. Três fiadas de pedras gastas, junta clara", paint: "stoneC" }],
  brick: [{ name: "A. Tijolo à vista, junta clara (o do teste)", paint: "brickA" }, { name: "B. Rebocado, tijolo aparecendo onde caiu", paint: "brickB" }, { name: "C. Tijolo escuro, junta escura, alguns queimados", paint: "brickC" }],
  wood: [{ name: "A. Tábuas ao comprido com pregos (o do teste)", paint: "woodA" }, { name: "B. Casa de toras", paint: "woodB" }, { name: "C. Enxaimel (vigas, reboco e esteios)", paint: "woodC" }],
};
const TITLES = { rock: "Rocha", stone: "Pedra lavrada", brick: "Tijolo", wood: "Madeira" };

let W, H;
function drawPanel(canvas, version, seed) {
  W = COLS * CELL; H = ROWS * CELL;
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  canvas.width = W * dpr; canvas.height = H * dpr; canvas.style.width = W + "px"; canvas.style.height = H + "px";
  const ctx = canvas.getContext("2d"); ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.fillStyle = "#6a8546"; ctx.fillRect(0, 0, W, H); grain(ctx, 0, 0, W, H, 0.35, 0.6);
  ctx.strokeStyle = "rgba(0,0,0,.12)"; for (let c = 0; c <= COLS; c++) { ctx.beginPath(); ctx.moveTo(c * CELL, 0); ctx.lineTo(c * CELL, H); ctx.stroke(); } for (let r = 0; r <= ROWS; r++) { ctx.beginPath(); ctx.moveTo(0, r * CELL); ctx.lineTo(W, r * CELL); ctx.stroke(); }
  const chains = chainsOf(SCENE.map((w) => ({ a: mul(w.a, CELL), b: mul(w.b, CELL) })));
  const t = T * CELL;
  if (version.draw) return version.draw(ctx, chains, t, seed);
  // fiadas: sombra e tinta de todas, depois o corpo de todas
  ctx.save(); ctx.shadowColor = "rgba(0,0,0,.55)"; ctx.shadowBlur = t * 0.6; ctx.shadowOffsetY = t * 0.2; ctx.fillStyle = INK; for (const c of chains) ctx.fill(outlinePath(c, t / 2, t)); ctx.restore();
  ctx.lineJoin = "round"; ctx.strokeStyle = INK; ctx.lineWidth = t * 0.22; for (const c of chains) ctx.stroke(outlinePath(c, t / 2, t));
  for (const c of chains) {
    const { left, right, dirs } = outline(c, t / 2, t); let s = 0;
    for (let i = 0; i < c.pts.length - 1; i++) {
      const a = c.pts[i], b = c.pts[i + 1], L = len(sub(b, a));
      const quad = new Path2D(); for (const p of [left[i], left[i + 1], right[i + 1], right[i]]) quad.lineTo(...p); quad.closePath();
      ctx.save(); ctx.clip(quad); ctx.translate(...a); ctx.rotate(Math.atan2(dirs[i][1], dirs[i][0])); ctx.translate(-s, 0);
      PAINT[version.paint](ctx, s - t * 2, s + L + t * 2, t, seed); ctx.restore(); s += L;
    }
  }
}

function render() {
  const root = document.getElementById("sections"); root.innerHTML = "";
  for (const style of Object.keys(VERSIONS)) {
    const h2 = document.createElement("h2"); h2.textContent = TITLES[style]; root.appendChild(h2);
    const row = document.createElement("div"); row.className = "row"; root.appendChild(row);
    VERSIONS[style].forEach((version, i) => { const fig = document.createElement("figure"); const canvas = document.createElement("canvas"); const cap = document.createElement("figcaption"); cap.textContent = version.name; fig.append(canvas, cap); row.appendChild(fig); drawPanel(canvas, version, 1234 + i); });
  }
}
document.querySelectorAll("[data-z]").forEach((b) => b.onclick = () => { CELL = b.dataset.z === "2" ? 88 : 44; document.querySelectorAll("[data-z]").forEach((x) => x.classList.toggle("on", x === b)); render(); });
document.querySelectorAll("[data-t]").forEach((b) => b.onclick = () => { T = +b.dataset.t; document.querySelectorAll("[data-t]").forEach((x) => x.classList.toggle("on", x === b)); render(); });
render();
</script>
</body>
