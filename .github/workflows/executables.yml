# Gera e testa o app do mestre de cada sistema (Electron, ADR-18).
# Reaproveitado pela CI (PRs) e pela release (tags). Cada sistema gera o próprio pacote:
# Windows .exe portátil, macOS .dmg (arm64), Linux .AppImage.
# Os nomes dos jobs ("Executáveis / win-x64"…) são checks obrigatórios da master: não renomear.
name: Executáveis

on:
  workflow_call:
    inputs:
      retention-days:
        description: Dias que os pacotes ficam disponíveis como artefato
        type: number
        default: 7

jobs:
  build:
    name: ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: win-x64
            # O teste de fumaça roda a versão descompactada (o .exe portátil extrai antes de abrir).
            bin: release/win-unpacked/jamals-tabletop.exe
          - os: ubuntu-latest
            target: linux-x64
            # Na CI o sandbox do Chromium exige root no chrome-sandbox; para o teste basta desligar.
            bin: xvfb-run -a release/linux-unpacked/jamals-tabletop --no-sandbox
          - os: macos-latest
            target: macos-arm64
            # O nome tem apóstrofo ("Jamal's"): localiza o binário em vez de escrever o caminho.
            bin: "\"$(ls -d release/mac-arm64/*.app/Contents/MacOS/* | head -1)\""
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci --no-audit --no-fund

      - name: Gera o pacote
        run: npm run package

      - name: Localiza o arquivo
        id: pkg
        run: |
          file=$(ls release/jamals-tabletop-*-${{ matrix.target }}.* | head -1)
          test -n "$file"
          echo "path=$file" >> "$GITHUB_OUTPUT"
          echo "name=$(basename "$file")" >> "$GITHUB_OUTPUT"
          size=$(( $(wc -c < "$file") / 1024 / 1024 ))
          echo "$(basename "$file"): ${size} MB" | tee -a "$GITHUB_STEP_SUMMARY"
          # Windows deu ~106 MB: quase tudo é o Electron (Chromium + Node).
          test "$size" -le 200

      - name: Teste de fumaça (--server-only, sem node_modules)
        run: |
          ${{ matrix.bin }} --server-only --port 3999 > app.log 2>&1 &
          pid=$!
          ok=0
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:3999/healthz; then ok=1; break; fi
            sleep 1
          done
          echo
          if ! curl -fsS http://localhost:3999/ | grep -q '<div id="root">'; then ok=0; fi
          if ! curl -fsS "http://localhost:3999/socket.io/?EIO=4&transport=polling" | grep -q '"sid"'; then ok=0; fi
          cat app.log
          kill "$pid" 2>/dev/null || true
          test "$ok" = 1

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.pkg.outputs.name }}
          path: ${{ steps.pkg.outputs.path }}
          retention-days: ${{ inputs.retention-days }}
          if-no-files-found: error
