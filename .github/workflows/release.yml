# Release automática (ADR-14): uma tag vX.Y.Z na master gera
#   - executáveis de Windows, Linux e macOS anexados à GitHub Release (+ SHA256SUMS.txt)
#   - imagem Docker no GHCR com as tags X.Y.Z, X.Y e latest
# Antes da tag: atualizar "version" no package.json e a seção do CHANGELOG.md (ver README).
name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write
  packages: write

jobs:
  check:
    name: Confere versão e changelog
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg=$(node -p "require('./package.json').version")
          if [ "$tag" != "$pkg" ]; then
            echo "::error::A tag v$tag não bate com a versão do package.json ($pkg)."
            exit 1
          fi
          node scripts/release-notes.mjs "$pkg" > /dev/null
          echo "version=$pkg" >> "$GITHUB_OUTPUT"

  executables:
    name: Executáveis
    needs: check
    uses: ./.github/workflows/executables.yml
    with:
      retention-days: 30

  docker:
    name: Imagem Docker (GHCR)
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # O GHCR exige nome em minúsculas.
      - run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  publish:
    name: Publica a release
    needs: [check, executables, docker]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: simulador-encontros-*
          path: release
          merge-multiple: true

      - name: Checksums e notas
        run: |
          ls -la release
          (cd release && sha256sum simulador-encontros-* > SHA256SUMS.txt && cat SHA256SUMS.txt)
          node scripts/release-notes.mjs "${{ needs.check.outputs.version }}" "${GITHUB_REPOSITORY,,}" > notes.md
          cat notes.md

      - uses: softprops/action-gh-release@v2
        with:
          name: Simulador de Encontros v${{ needs.check.outputs.version }}
          body_path: notes.md
          files: release/*
          fail_on_unmatched_files: true
