<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<title>Jamal's Tabletop</title>
<style>
  /* Tela de abertura do app do mestre, nas cores do guia visual (docs/design/guia-visual.md). */
  html, body { margin: 0; height: 100%; background: #141218; color: #ece4d4; font-family: "Segoe UI", system-ui, sans-serif; }
  body { display: grid; place-items: center; background-image: radial-gradient(ellipse at 50% 40%, rgb(169 132 79 / 0.16), transparent 60%); }
  main { display: flex; flex-direction: column; align-items: center; gap: 12px; text-align: center; max-width: 560px; padding: 24px; }
  h1 { margin: 0; font-family: Cinzel, "Trajan Pro", Georgia, serif; font-weight: 700; font-size: 32px; color: #d8b47a; letter-spacing: 0.02em; }
  p { margin: 0; color: #b9ae9c; font-size: 15px; }
  pre { margin: 8px 0 0; padding: 12px; max-width: 100%; white-space: pre-wrap; text-align: left; font-size: 13px; color: #f2c4c7; background: #1f1b25; border: 1px solid #a8323a; border-radius: 6px; }
  button { font: 700 14px "Segoe UI", system-ui, sans-serif; color: #1a1520; background: #a9844f; border: 1px solid #d8b47a; border-radius: 6px; padding: 8px 18px; cursor: pointer; }
  button:hover { background: #c19a62; }
  .spin { animation: pulse 1.6s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: 0.55; } }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <svg class="spin" width="112" height="112" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256"><defs><radialGradient id="g" cx=".35" cy=".25" r=".9"><stop offset="0" stop-color="#43384d"/><stop offset="1" stop-color="#1a1520"/></radialGradient></defs><rect x="10" y="10" width="236" height="236" rx="36" fill="url(#g)" stroke="#a9844f" stroke-width="6"/><rect x="22" y="22" width="212" height="212" rx="26" fill="none" stroke="#d8b47a" stroke-opacity=".35" stroke-width="2"/><path d="M14 70V40a26 26 0 0 1 26-26h30M242 186v30a26 26 0 0 1-26 26h-30" fill="none" stroke="#d8b47a" stroke-width="10" stroke-linecap="round"/><path d="M128 94L173 170L83 170Z" fill="#f0dcb2"/><path d="M128 44L53 87L128 94Z" fill="#e3c48e"/><path d="M128 44L128 94L203 87Z" fill="#c9a26a"/><path d="M53 87L83 170L128 94Z" fill="#d4b07a"/><path d="M203 87L128 94L173 170Z" fill="#a9844f"/><path d="M53 87L53 173L83 170Z" fill="#b48d58"/><path d="M203 87L173 170L203 173Z" fill="#8a6a3e"/><path d="M53 173L128 216L83 170Z" fill="#8a6a3e"/><path d="M203 173L173 170L128 216Z" fill="#6e5331"/><path d="M83 170L128 216L173 170Z" fill="#8a6a3e"/><g fill="none" stroke="#3b2a0d" stroke-linejoin="round" stroke-width="3"><path d="M128 94L173 170L83 170Z"/><path d="M128 44L53 87L128 94Z"/><path d="M128 44L128 94L203 87Z"/><path d="M53 87L83 170L128 94Z"/><path d="M203 87L128 94L173 170Z"/><path d="M53 87L53 173L83 170Z"/><path d="M203 87L173 170L203 173Z"/><path d="M53 173L128 216L83 170Z"/><path d="M203 173L173 170L128 216Z"/><path d="M83 170L128 216L173 170Z"/><path stroke-width="4.199999999999999" d="M128 44L203 87L203 173L128 216L53 173L53 87Z"/></g><text x="128" y="158" text-anchor="middle" font-family="Cinzel, Georgia, serif" font-weight="700" font-size="33" fill="#3b2a0d">20</text></svg>
  <h1>Jamal's Tabletop</h1>
  <p id="status">Iniciando a mesa…</p>
  <pre id="error" hidden></pre>
  <button id="retry" type="button" hidden>Tentar de novo</button>
</main>
<script>
  const error = new URLSearchParams(location.search).get("error");
  if (error) {
    document.querySelector(".spin").classList.remove("spin");
    document.getElementById("status").textContent = "Não foi possível iniciar a mesa.";
    const pre = document.getElementById("error");
    pre.textContent = error;
    pre.hidden = false;
    const retry = document.getElementById("retry");
    retry.hidden = false;
    retry.addEventListener("click", () => window.desktop.retry());
  }
</script>
</body>
</html>
