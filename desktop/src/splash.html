<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<title>Jamal's Tabletop</title>
<style>
  /* Tela de abertura do app do mestre, nas cores do guia visual (docs/design/guia-visual.md). */
  html, body { margin: 0; height: 100%; background: #141218; color: #ece4d4; font-family: "Segoe UI", system-ui, sans-serif; }
  body { display: grid; place-items: center; background-image: radial-gradient(ellipse at 50% 40%, rgb(169 132 79 / 0.16), transparent 60%); }
  main { display: flex; flex-direction: column; align-items: center; gap: 12px; text-align: center; max-width: 560px; padding: 24px; }
  h1 { margin: 0; font-family: Cinzel, "Trajan Pro", Georgia, serif; font-weight: 700; font-size: 32px; color: #d8b47a; letter-spacing: 0.02em; }
  p { margin: 0; color: #b9ae9c; font-size: 15px; }
  pre { margin: 8px 0 0; padding: 12px; max-width: 100%; white-space: pre-wrap; text-align: left; font-size: 13px; color: #f2c4c7; background: #1f1b25; border: 1px solid #a8323a; border-radius: 6px; }
  button { font: 700 14px "Segoe UI", system-ui, sans-serif; color: #1a1520; background: #a9844f; border: 1px solid #d8b47a; border-radius: 6px; padding: 8px 18px; cursor: pointer; }
  button:hover { background: #c19a62; }
  .spin { animation: pulse 1.6s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: 0.55; } }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <svg class="spin" width="96" height="96" viewBox="0 0 24 24" fill="none" stroke="#d8b47a" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    <polygon points="12 2.5 20.5 7.25 20.5 16.75 12 21.5 3.5 16.75 3.5 7.25" />
    <polygon points="12 7 17 15.5 7 15.5" />
    <path d="M12 2.5V7M20.5 16.75L17 15.5M3.5 16.75L7 15.5M3.5 7.25L7 15.5M20.5 7.25L17 15.5" />
  </svg>
  <h1>Jamal's Tabletop</h1>
  <p id="status">Iniciando a mesa…</p>
  <pre id="error" hidden></pre>
  <button id="retry" type="button" hidden>Tentar de novo</button>
</main>
<script>
  const error = new URLSearchParams(location.search).get("error");
  if (error) {
    document.querySelector(".spin").classList.remove("spin");
    document.getElementById("status").textContent = "Não foi possível iniciar a mesa.";
    const pre = document.getElementById("error");
    pre.textContent = error;
    pre.hidden = false;
    const retry = document.getElementById("retry");
    retry.hidden = false;
    retry.addEventListener("click", () => window.desktop.retry());
  }
</script>
</body>
</html>
